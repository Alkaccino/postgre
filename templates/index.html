<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="landingpage">
        <title>Itemlist</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <h1>Itemlist</h1>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Itemname</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Delete</th>
                    <th>Edit</th>
                </tr>
            </thead>
            <tbody>
                {{range .}}
                <tr>
                    <th>{{.Id}}</th>
                    <th>{{.Item_name}}</th>
                    <th>{{.Item_category}}</th>
                    <th>{{.Item_amount}}</th>
                    <th>
                        <form action="/" method="POST">
                            <input type="hidden" value="{{.Id}}" name="delete">
                            <input type="submit" value="X">
                        </form>
                    </th>
                    <th>
                        <form action="/update/" method="POST">
                            <input type="hidden" value="{{.Id}}" name="edit">
                            <input type="submit" value="E">
                        </form>
                    </th>
                </tr>
                {{end}}
            </tbody>
        </table>
        <a href="/create">Create new Item</a>
    </body>
</html>
