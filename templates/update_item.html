<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="create-page">
        <title>Update Item</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <h1>Update Item</h1>

        <form action="/update/{{.Id}}" method="POST">
            <label for="item_name">Itemname:</label><br>
            <input type="text" id="item_name" name="item_name" value="{{.Item_name}}" required><br>
            <label for="item_category">Category:</label><br>
            <input type="text" id="item_category" name="item_category" value="{{.Item_category}}" required><br>
            <label for="item_amount">Amount:</label><br>
            <input type="number" id="item_amount" name="item_amount" value="{{.Item_amount}}" required><br>
            <input type="submit" value="Submit"><br>
        </form>

        <a class="normal" href="/">Go back</a>
    </body>
</html>
