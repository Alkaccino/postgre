<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="create-page">
        <title>Update Asset</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <h1>Update Asset</h1>

        <form action="/update/{{.Id}}" method="POST">
            <label for="asset_name">Assetname:</label><br>
            <input type="text" id="asset_name" name="asset_name" value="{{.Asset_name}}" required><br>
            <label for="category">Category:</label><br>
            <input type="text" id="category" name="category" value="{{.Category}}" required><br>
            <label for="serial_number">Serialnumber:</label><br>
            <input type="text" id="serial_number" name="serial_number" value="{{.Serialnumber}}"><br>
            <label for="model">Model:</label><br>
            <input type="text" id="model" name="model" value="{{.Model}}"><br>
            <label for="manufacturer">Manufacturer:</label><br>
            <input type="text" id="manufacturer" name="manufacturer" value="{{.Manufacturer}}"><br>
            <label for="assigned_user">Assigned user:</label><br>
            <input type="text" id="assigned_user" name="assigned_user" value="{{.Assigned_user}}"><br>
            <label for="asset_location">Asset location:</label><br>
            <input type="text" id="asset_location" name="asset_location" value="{{.Asset_location}}"><br>
            <label for="purchased_price">Purchased price:</label><br>
            <input type="text" id="purchased_price" name="purchased_price" value="{{.Purchased_at}}"><br>
            <label for="purchased_at">Purchased at:</label><br>
            <input type="text" id="purchased_at" name="purchased_at" value="{{.Purchased_price}}"><br>
            <label for="quantity">Quantity:</label><br>
            <input type="number" id="quantity" name="quantity" value="{{.Quantity}}"><br>
            <label for="asset_status">Asset status:</label><br>
            <input type="text" id="asset_status" name="asset_status" value="{{.Asset_status}}"><br>
            <label for="created_by">Created by:</label><br>
            <input type="text" id="created_by" name="created_by" value="{{.Created_by}}"><br>
            <label for="updated_by">Updated by:</label><br>
            <input type="text" id="updated_by" name="updated_by" value="{{.Updated_by}}"><br>
            <input type="submit" value="Submit"><br>
        </form>

        <a class="normal" href="/">Go back</a>
    </body>
</html>
